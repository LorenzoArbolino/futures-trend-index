name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies: the project uses the standard library only. The tests
      # that need the downloaded database skip themselves; the end-to-end test
      # builds a synthetic one.
      - run: python -m unittest discover -s tests -v
